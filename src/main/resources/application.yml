spring:
  application:
    name: bankcards

datasource:
  url: jdbc:postgresql://localhost:5432/bankcards_db
  username: bankcards_user
  password: bankcards_pass
  driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.yaml

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-minimum-32-characters}
    expiration: 86400000 # 24 hours in milliseconds
  card:
    encryption-key: ${APP_CARD_ENCRYPTION_KEY:MTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTBhYmNkZWY=} # Base64 encoded 32-byte key

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

