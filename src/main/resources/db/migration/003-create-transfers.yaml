databaseChangeLog:
  - changeSet:
      id: 003-create-transfers
      author: bank-rest
      changes:
        - createTable:
            tableName: transfers
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_card_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: to_card_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: from_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transfers_from_card
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: to_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transfers_to_card
            onDelete: RESTRICT
        - createIndex:
            tableName: transfers
            indexName: idx_transfers_from_card
            columns:
              - column:
                  name: from_card_id
        - createIndex:
            tableName: transfers
            indexName: idx_transfers_to_card
            columns:
              - column:
                  name: to_card_id
        - addCheckConstraint:
            tableName: transfers
            constraintName: chk_transfers_amount_positive
            checkConstraint: amount > 0